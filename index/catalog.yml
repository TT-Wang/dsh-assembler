    - { name: "travel-matrix", description: "多点之间的行程时长/距离矩阵(排班、就近派单、路线取舍用)。坐标 [经度, 纬度],2..12 个点。" }

- id: im-bot
  kind: service
  service: "企业微信/钉钉/飞书 群机器人 webhook"
  provider: "腾讯 / 阿里 / 字节(各自开放平台)"
  license: "BSD-3-Clause"
  terms: "各家群机器人使用条款(频率限制通常 20 条/分钟)"
  rateLimit: "按各家群机器人限制"
  network: true
  requiredSecrets:
    - { env: "WECOM_WEBHOOK", purpose: "企业微信群机器人 webhook URL" }
    - { env: "DINGTALK_WEBHOOK", purpose: "钉钉群机器人 webhook URL" }
    - { env: "DINGTALK_SECRET", purpose: "钉钉加签密钥(开启加签时)" }
    - { env: "FEISHU_WEBHOOK", purpose: "飞书群机器人 webhook URL" }
  tools:
    - { name: "imbot-info", description: "报告各供应商的配置状态(哪些 webhook 已配、钉钉是否加签)——**不回显 URL 与密钥**。装配前用它确认\"接口是否就位\"。" }
    - { name: "imbot-send", description: "往群机器人推一条文本消息(告警/日报/审批结果)。provider:wecom|dingtalk|feishu|mock。URL 走进程环境,不经参数。支持 @" }

- id: object-store
  kind: service
  service: "S3 兼容端点(S3_ENDPOINT 可切:MinIO/OSS/COS/R2/AWS)"
  provider: "所选对象存储服务商"
  license: "Apache-2.0(minio 客户端)"
  terms: "所选服务商条款"
  rateLimit: "按所选服务商配额"
  network: true
  requiredSecrets:
    - { env: "S3_ENDPOINT", purpose: "对象存储端点" }
    - { env: "S3_ACCESS_KEY", purpose: "访问密钥 ID" }
    - { env: "S3_SECRET_KEY", purpose: "访问密钥" }
  tools:
    - { name: "s3-info", description: "报告对象存储端点/区域与凭证状态(**不回显密钥**)。装配前用它确认\"接口是否就位\"。" }
    - { name: "s3-list", description: "列出桶内对象(可给前缀),返回名字/大小/修改时间。" }
    - { name: "s3-upload", description: "把工作区里的文件上传为对象(路径进,不读内容进上下文)。" }
    - { name: "s3-download", description: "把对象下载到工作区(路径出,不返回内容)。下载后可直接交给解析类零件。" }
    - { name: "s3-presign", description: "生成对象的临时直取 URL(默认 1 小时)。给浏览器/第三方直接下载——**字节既不过模型也不过 host**。" }

