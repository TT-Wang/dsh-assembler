    - { name: unit-convert, description: "单位换算:把带单位的量换算到目标单位,如 value='12.7 cm' + target='inch' → '5 inch'。支持 mathjs 全部内置单位" }

- id: cron-parse
  repo: harrisiirak/cron-parser
  rev: v5.10.0
  license: MIT
  tools:
    - { name: next-runs, description: "解析 cron 表达式,返回接下来 n 次执行时间(ISO 8601,每行一条)。支持 5 或 6 段表达式与 @daily 等别名;可选 tz 指定 IANA" }
    - { name: describe-fields, description: "解析 cron 表达式,返回规范化形式(含秒的 6 段写法)与各字段展开后的具体取值(second/minute/hour/dayOfMonth/month/d" }

- id: semver-check
  repo: npm/node-semver
  rev: v7.8.5
  license: ISC
  tools:
    - { name: compare, description: "比较两个语义化版本号 a 与 b,首行返回 -1/0/1(a 低于/等于/高于 b),第二行给出人话结论。遵循 semver 优先级规则(1.10.0 > 1." }
    - { name: satisfies, description: "判断版本号是否落在版本范围内,首行返回 true/false,第二行给出人话结论。范围支持 npm 语法:'^1.2.0'、'~1.2.3'、'>=1.0.0 " }
    - { name: coerce-valid, description: "把脏版本输入规范化成合法 semver:'v1.2' → '1.2.0'、'v2' → '2.0.0'、'release-3.4.5-final' → '3.4" }

