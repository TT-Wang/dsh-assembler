# dsh-assembler 代码索引目录
#
# 每条目 = 一个经过"切分→生成适配→构建→冒烟验证"的开源库能力集。
# 来源：索引流水线（AI 切分 + 生成 MCP stdio 适配 + 冒烟验证）。
# 约定：
#   - verified: true 表示 listTools 成功且至少一次真实工具调用/校验往返成功
#   - 上游源码不 vendored，按 rev 从 GitHub/npm 拉取；generated/<id>/ 是我们的适配代码
#   - 组装目录（capabilities.yml）的 mcp-servers 段与本文件一一对应
#
# 试点批次（2026-08-12）：10 库 / 37 工具，全部 verified。

- id: email-send
  repo: nodemailer/nodemailer
  rev: v6.9.13
  license: MIT
  tools:
    - { name: send-email, description: 发送邮件（smtp/json/stream 三种 transport）}
    - { name: verify-smtp-config, description: 验证 SMTP 连接与认证 }
    - { name: parse-email-addresses, description: 解析 RFC 5322 地址列表 }
    - { name: create-test-account, description: 创建 Ethereal 临时测试邮箱 }

- id: email-fetch
  repo: postalsys/imapflow
  rev: v1.0.162
  license: MIT
  tools:
    - { name: list-mailboxes, description: 列出 IMAP 邮箱文件夹 }
    - { name: search-messages, description: 按条件搜索邮件 UID }
    - { name: fetch-message, description: 按 UID 获取邮件全文/信封/结构 }
    - { name: list-message-summaries, description: 浏览邮箱邮件摘要列表 }

- id: http-request
  repo: axios/axios
  rev: v1.7.2
  license: MIT
  tools:
    - { name: http-request, description: 通用 HTTP 请求（任意方法/参数/认证）}
    - { name: http-get, description: HTTP GET 拉取 URL }
    - { name: http-post, description: HTTP POST 提交 JSON }
    - { name: build-url, description: 拼接 URL（纯本地，不发起请求）}

- id: html-parse
  repo: cheeriojs/cheerio
  rev: v1.0.0-rc.12
  license: MIT
  tools:
    - { name: extract-text, description: 从 HTML 提取文本 }
    - { name: extract-attributes, description: 按选择器批量提取属性（链接/图片等）}
    - { name: query-elements, description: 查询元素结构摘要 }
    - { name: serialize-html, description: HTML/XML 规范化序列化 }

- id: csv-parse
  repo: papaparse/papaparse
  rev: 5.4.1
  license: MIT
  tools:
    - { name: parse-csv, description: CSV 文本转 JSON }
    - { name: unparse-csv, description: JSON 序列化为 CSV }
    - { name: validate-csv, description: 校验 CSV 格式与分隔符探测 }

- id: pdf-generate
  repo: Hopding/pdf-lib
  rev: v1.17.1
  license: MIT
  tools:
    - { name: create-pdf, description: 生成多页 PDF（文本/坐标/颜色）}
    - { name: merge-pdfs, description: 合并多个 PDF }
    - { name: extract-pages, description: 抽取指定页组成新 PDF }
    - { name: pdf-info, description: 读取 PDF 元信息（页数/尺寸/加密）}

- id: date-format
  repo: iamkun/dayjs
  rev: v1.11.11
  license: MIT
  tools:
    - { name: format-date, description: 日期时间格式化 }
    - { name: parse-date, description: 解析日期为结构化字段 }
    - { name: date-diff, description: 两个日期差值计算 }
    - { name: date-manipulate, description: 日期加减/月初月末等链式操作 }

- id: sqlite-query
  repo: WiseLibs/better-sqlite3
  rev: v11.1.2
  license: MIT
  tools:
    - { name: query, description: SQLite 只读查询（SELECT）}
    - { name: execute, description: SQLite 写/DDL 执行 }
    - { name: list-tables, description: 列出库中表与视图 }

- id: github-api
  repo: octokit/rest.js
  rev: v20.1.1
  license: MIT
  tools:
    - { name: get-user, description: 获取 GitHub 用户公开资料 }
    - { name: get-repo, description: 获取仓库元数据 }
    - { name: list-org-repos, description: 列出组织仓库 }
    - { name: search-repositories, description: 搜索公开仓库 }

- id: markdown-render
