    - { name: hmac-sign, description: "用密钥对文本做 HMAC 签名(webhook 校验、API 签名场景)。algorithm 支持 sha256/sha512/sha1;返回 hex 签名。v" }
    - { name: generate-uuid, description: "生成 UUID v4。count 可选(1-100,默认 1),每行一个。" }

- id: math-eval
