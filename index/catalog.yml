      description: 解析工作区内 EPUB 电子书(container.xml→content.opf spine 顺序),返回书名与章节列表(标题+正文纯文本);松散 zip 按条目名取 xhtml
    - name: extract-text-file
      description: 读取工作区内文本文件(支持 utf-8/gbk/big5/shift_jis 等编码),解码为 UTF-8 返回

- id: text-diff
  repo: kpdecker/jsdiff
  rev: v9.0.0
  license: BSD-3-Clause
  tools:
    - { name: create-patch, description: "对比两段文本,生成统一 diff(unified diff)补丁文本。输入旧文本/新文本与可选文件名;返回标准补丁(含 ---/+++/@@ 头),可直接交给 " }
    - { name: apply-patch, description: "把统一 diff 补丁应用到文本上,返回打完补丁的新文本。补丁与文本对不上(上下文不匹配)时返回错误而不是产出损坏结果。" }
    - { name: diff-words, description: "词级对比两段文本,返回带标注的合并视图:新增词包在 {+...+} 里,删除词包在 [-...-] 里,未变的词原样保留。适合向用户展示两版措辞的具体差别。" }

