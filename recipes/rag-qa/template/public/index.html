<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识问答</title>
<style>
  :root {
    --bg: #ffffff; --surface: #ffffff; --border: #e5e7eb; --border-2: #d1d5db;
    --fg: #111827; --muted: #6b7280; --faint: #9ca3af;
    --accent: #111827; --accent-fg: #ffffff; --link: #0b57d0; --tint: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0c; --surface: #131316; --border: #26262b; --border-2: #3a3a41;
      --fg: #f3f4f6; --muted: #9ca3af; --faint: #6b7280;
      --accent: #f3f4f6; --accent-fg: #111827; --link: #8ab4f8; --tint: #1c1c21;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); }
  header b { font-size: 15px; letter-spacing: -0.02em; }
  header .role { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 120px; }
  .empty { border: 1px dashed var(--border-2); border-radius: 12px; padding: 24px; color: var(--muted); }
  .empty .ex { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { border: 1px solid var(--border); border-radius: 9999px; padding: 4px 12px; font-size: 12px; color: var(--muted); background: var(--surface); cursor: pointer; }
  .chip:hover { background: var(--tint); }
  .msg { margin: 16px 0; }
  .msg .q { font-weight: 600; }
  .msg .think { margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--tint); }
  .msg .think summary { cursor: pointer; padding: 6px 10px; font-size: 12px; color: var(--muted); user-select: none; }
  .msg .think pre { margin: 0; padding: 8px 10px; white-space: pre-wrap; font: 12px/1.6 inherit; color: var(--faint); max-height: 180px; overflow-y: auto; }
  .msg .a { margin-top: 8px; white-space: pre-wrap; }
  .msg .a .cite { color: var(--link); cursor: pointer; font-weight: 600; }
  .msg .srcs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .msg .err { margin-top: 8px; border: 1px solid #d97706; border-radius: 8px; padding: 8px 12px; color: #d97706; font-size: 13px; }
  .cursor { display: inline-block; width: 7px; height: 14px; background: var(--muted); animation: blink 1s steps(1) infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }
  footer { position: fixed; bottom: 0; left: 0; right: 0; border-top: 1px solid var(--border); background: var(--bg); }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; padding: 12px 16px; }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--border-2); border-radius: 8px; padding: 9px 12px; font: inherit; background: var(--surface); color: var(--fg); }
  .composer textarea:focus-visible { outline: 2px solid color-mix(in srgb, var(--muted) 40%, transparent); outline-offset: 1px; }
  .composer button { border: 0; border-radius: 8px; padding: 0 18px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 500; cursor: pointer; }
  .composer button:disabled { opacity: 0.45; cursor: default; }
  dialog { border: 1px solid var(--border-2); border-radius: 12px; background: var(--surface); color: var(--fg); max-width: 640px; width: calc(100vw - 48px); padding: 0; }
  dialog::backdrop { background: rgb(0 0 0 / 0.35); }
  dialog .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  dialog .head a { color: var(--link); text-decoration: none; }
  dialog pre { margin: 0; padding: 14px; white-space: pre-wrap; font: 13px/1.7 inherit; max-height: 55vh; overflow-y: auto; }
  dialog .close { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; font-size: 12px; }
</style>
</head>
<body>
<header><b id="appName">知识问答</b><span class="role" id="roleLine"></span></header>
<main id="list">
  <div class="empty" id="empty">问点语料里有的问题——回答会标注 [n] 引用,点开能看到原文出处。<div class="ex" id="examples"></div></div>
</main>
<footer><div class="composer">
  <textarea id="box" rows="1" placeholder="输入问题…(Enter 发送,Shift+Enter 换行)"></textarea>
  <button id="send">发送</button>
</div></footer>
<dialog id="srcDialog"><div class="head"><span id="srcTitle"></span><span style="display:flex;gap:8px;align-items:center"><a id="srcLink" target="_blank" rel="noopener">打开原文 ↗</a><button class="close" id="srcClose">关闭</button></span></div><pre id="srcText"></pre></dialog>
<script>
const $ = (id) => document.getElementById(id);
let busy = false;

fetch('/api/meta').then((r) => r.json()).then((m) => {
  $('appName').textContent = m.appName; document.title = m.appName;
  $('roleLine').textContent = m.roleLine || '';
  for (const q of m.examples || []) {
    const c = document.createElement('button'); c.className = 'chip'; c.textContent = q;
    c.onclick = () => { $('box').value = q; send(); };
    $('examples').appendChild(c);
  }
}).catch(() => {});

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function renderAnswer(el, text, sources) {
  // 纯文本 + [n] 标注:转义后把 [n] 换成可点的引用位(编号与 sources 1:1)
  el.innerHTML = esc(text).replace(/\[(\d+)\]/g, (m, n) => {
    const i = Number(n) - 1;
    return sources && sources[i] ? `<span class="cite" data-i="${i}">[${n}]</span>` : m;
  });
}

function openSource(s) {
  $('srcTitle').textContent = `${s.source} — ${s.heading}`;
  $('srcLink').href = s.url;
  $('srcText').textContent = s.text;
  $('srcDialog').showModal();
}
$('srcClose').onclick = () => $('srcDialog').close();

async function send() {
  const q = $('box').value.trim();
  if (!q || busy) return;
  busy = true; $('send').disabled = true; $('box').value = '';
  $('empty')?.remove();

  const msg = document.createElement('div'); msg.className = 'msg';
  msg.innerHTML = '<div class="q"></div><details class="think" hidden><summary>思考中…</summary><pre></pre></details><div class="a"><span class="cursor"></span></div><div class="srcs"></div>';
  msg.querySelector('.q').textContent = q;
  $('list').appendChild(msg);
  msg.scrollIntoView({ block: 'end' });

  const think = msg.querySelector('.think'), thinkPre = think.querySelector('pre');
  const aEl = msg.querySelector('.a'), srcsEl = msg.querySelector('.srcs');
  let answer = '', sources = null, gotDelta = false;

  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: q }) });
    if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        const line = frame.split('\n').find((l) => l.startsWith('data: '));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        if (ev.thinking) { think.hidden = false; think.open = true; thinkPre.textContent += ev.thinking; thinkPre.scrollTop = thinkPre.scrollHeight; }
        if (ev.delta) {
          if (!gotDelta) { gotDelta = true; think.open = false; think.querySelector('summary').textContent = '思考过程'; }
          answer += ev.delta; aEl.textContent = answer;
        }
        if (ev.sources) sources = ev.sources;
        if (ev.error) { const e = document.createElement('div'); e.className = 'err'; e.textContent = ev.error; msg.appendChild(e); }
      }
    }
    renderAnswer(aEl, answer || (sources && sources.length === 0 ? aEl.textContent : answer), sources);
    aEl.querySelectorAll('.cite').forEach((c) => { c.onclick = () => openSource(sources[Number(c.dataset.i)]); });
    (sources || []).forEach((s, i) => {
      const c = document.createElement('button'); c.className = 'chip'; c.textContent = `[${i + 1}] ${s.source}`;
      c.onclick = () => openSource(s);
      srcsEl.appendChild(c);
    });
  } catch (err) {
    const e = document.createElement('div'); e.className = 'err'; e.textContent = '请求失败:' + err.message; msg.appendChild(e);
  } finally {
    msg.querySelector('.cursor')?.remove();
    busy = false; $('send').disabled = false; $('box').focus();
    msg.scrollIntoView({ block: 'end' });
  }
}

$('send').onclick = send;
$('box').addEventListener('keydown', (e) => {
  // IME 守卫(不可省):中文输入法选字的确认回车 isComposing=true,不拦会把半句话发出去
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
