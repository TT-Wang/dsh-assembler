# 配方:scaffold-react —— "内嵌 agent 能力的 web app" 的前端骨架(scaffold 车道)。
# 与 rag-qa/record-desk 不同:本配方产出的不是成品,是**词汇表+骨架+SDK+考卷格式**;
# src/pages/ 是主 agent 的唯一自由区(照 PAGE-SPEC 写页),其余骨架字节锁死
# (skeleton-lock 考)。构建产物 dist/ 经 static-deploy 进 preset 同源伺服。
# 改 template/ 任何字节(含 scaffold-sync-vocab 重同步)必须升 version 重过门:
#   node scripts/index-add.mjs recipe scaffold-react
id: scaffold-react
version: 1
description: >-
  定制前端骨架:Vite + React + shadcn/ui + Tailwind v4(13 件词汇已联邦入库)+
  固定通信 SDK(wire 会话/服务脸直连/围栏出声/IME 守卫)。主 agent 在 src/pages/
  照 PAGE-SPEC(动作路由标注:face/wire/ai-thin)写任意形状的页面;骨架锁字节,
  五道门验收(构建/骨架锁/页面 lint/可达/行为考)。
tags: [配方, scaffold, 前端, react, shadcn, tailwind, vite, 定制页面, 词汇表, app, ui, 骨架]
license: BSD-3-Clause
inspiredBy: >-
  Lovable 的 scaffold+词汇表形态(shadcn 源码预拷为 AI 写页词汇);组件经
  registry-add 联邦进货(index/registry.lock.yml 供应链锁),差异化 = 每张生成页
  过独立考官(行为考:face 动作验库效,wire 动作跑场景探针)。

params:
  - key: APP_NAME
    description: 应用名(页面标题)
    required: true
    example: 库存工作台
  - key: PRESET_ID
    description: 配套的 agent preset id(SDK 的 wire 会话与服务脸发现都指它)
    required: true
    example: inv-workbench
  - key: WORKDIR
    description: 该 preset 的 workspace 绝对路径(wire 会话 cwd)
    required: true
    example: /Users/x/.dsh/.agent-presets/inv-workbench/workspace

requiredSecrets: []

# skeleton-lock 考的锁定面:实例化时对这些路径算哈希入 lock,验收时重算比对——
# 写手越界改骨架/SDK/词汇 = FAIL(自由区只有 src/pages/ 与 PAGE-SPEC.yml)。
lockPaths:
  - index.html
  - vite.config.ts
  - tsconfig.json
  - src/main.tsx
  - src/App.tsx
  - src/index.css
  - src/lib
  - src/sdk
  - src/components

run:
  ingest: [npm, install, --no-audit, --no-fund]
  build: [npm, run, build]
  start: [npx, vite, preview, --port, '@@PORT@@', --strictPort, --host, '127.0.0.1']
  readyPath: /

selftest:
  checks:
    - kind: build
    - kind: skeleton-lock
    - kind: pages-lint
    - kind: static-reach
    - kind: behavior

sample:
  pagesDir: sample/pages
  params:
    APP_NAME: scaffold 样例
    PRESET_ID: sample-preset
    WORKDIR: /tmp/sample-workspace
