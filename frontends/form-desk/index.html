<!doctype html>
<!-- form-desk — 表单工单台(Franken UI):结构化提交 → agent 处理 → 结果 + 历史。 -->
<html lang="zh" class="uk-theme-zinc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · 工单台</title>
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="_vendor/core.min.css">
<link rel="stylesheet" href="_vendor/utilities.min.css">
<script src="_vendor/core.iife.js" defer></script>
<script src="_vendor/assembler-sdk.js"></script>
<style>
  .dot{width:9px;height:9px;border-radius:9999px;background:hsl(var(--muted-foreground));flex:none}
  .dot.busy{background:hsl(var(--primary));animation:pulse 1.1s infinite}
  .dot.ok{background:#10a37f}
  @keyframes pulse{50%{opacity:.3}}
  .prewrap{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
<header class="sticky top-0 z-10 flex items-center gap-3 border-b border-border bg-card px-6 py-3">
  <div class="dot" id="dot"></div>
  <div>
    <div class="font-semibold">{{title}} · 工单台</div>
    <div class="text-xs text-muted-foreground">preset {{presetId}} · 表单直达 agent</div>
  </div>
</header>
<div class="max-w-5xl mx-auto px-5 py-6 grid gap-5 md:grid-cols-[380px_1fr]">
  <div class="flex flex-col gap-5">
    <div class="uk-card">
      <div class="uk-card-header"><h2 class="uk-card-title text-sm">新提交</h2></div>
      <div class="uk-card-body flex flex-col gap-3">
        <div><label class="text-sm text-muted-foreground">标题</label>
          <input id="fTitle" class="uk-input mt-1" placeholder="一句话说清这单是什么"></div>
        <div><label class="text-sm text-muted-foreground">详情</label>
          <textarea id="fBody" class="uk-input mt-1 min-h-24" placeholder="补充上下文、要求、相关信息…"></textarea></div>
        <div><label class="text-sm text-muted-foreground">优先级</label>
          <select id="fPri" class="uk-select mt-1"><option>普通</option><option>高</option><option>低</option></select></div>
        <button class="uk-btn uk-btn-primary w-full" id="submitBtn">提交给 agent 处理</button>
        <div class="uk-alert uk-alert-destructive" id="err" style="display:none"></div>
      </div>
    </div>
    <div class="uk-card">
      <div class="uk-card-header"><h2 class="uk-card-title text-sm">提交历史(本机)</h2></div>
      <div class="uk-card-body pt-0"><ul class="uk-nav" id="hist"></ul></div>
    </div>
  </div>
  <div class="uk-card h-fit">
    <div class="uk-card-header"><h2 class="uk-card-title text-sm">处理结果</h2></div>
    <div class="uk-card-body">
      <div class="prewrap text-muted-foreground min-h-32" id="result">提交后,agent 的处理过程与结论会实时出现在这里。</div>
      <div class="flex flex-wrap gap-1 mt-3" id="tools"></div>
    </div>
  </div>
</div>
<div class="max-w-3xl mx-auto px-5 pb-6">  <div class="uk-card" id="liveCard" style="display:none">
    <div class="uk-card-header flex items-center justify-between">
      <h2 class="uk-card-title text-sm">实时台账 <span class="text-xs text-muted-foreground">(直连,不经模型)</span></h2>
      <span class="flex items-center gap-2"><select id="liveTable" class="uk-select uk-btn-sm" style="width:auto"></select><button class="uk-btn uk-btn-default uk-btn-sm" id="liveRefresh">刷新</button></span>
    </div>
    <div class="uk-card-body"><div class="overflow-x-auto" id="liveHost"></div></div>
  </div>
</div>
<script>
const CFG = { presetId: '{{presetId}}', workdir: '{{workdir}}' };
const $ = (id) => document.getElementById(id);
const dot = $('dot'), result = $('result'), tools = $('tools');
const HKEY = 'formdesk:' + CFG.presetId;

function setBusy(b) { dot.className = 'dot ' + (b ? 'busy' : 'ok'); $('submitBtn').disabled = b; }
function showErr(m) { const e = $('err'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 8000); }

const client = AssemblerSDK.createClient({
  presetId: CFG.presetId, workdir: CFG.workdir,
  onDelta: (buf) => { result.classList.remove('text-muted-foreground'); result.textContent = buf; },
  onToolCall: (name) => { const c = document.createElement('span'); c.className = 'uk-badge uk-badge-secondary'; c.textContent = '🔧 ' + name; tools.appendChild(c); },
  onError: (m) => { setBusy(false); showErr(m); },
});
const ledger = AssemblerSDK.mountLiveLedger({ presetId: CFG.presetId, cardEl: $('liveCard'), tableSel: $('liveTable'), hostEl: $('liveHost'), refreshBtn: $('liveRefresh') });

function loadHist() { try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch { return []; } }
function renderHist() {
  const ul = $('hist'); ul.innerHTML = '';
  for (const h of loadHist().slice(0, 20)) {
    const li = document.createElement('li');
    const a = document.createElement('a'); a.href = '#'; a.className = 'flex items-baseline gap-2';
    const t = document.createElement('span'); t.className = 'text-xs text-muted-foreground'; t.textContent = h.at;
    const p = document.createElement('span'); p.className = 'uk-badge ' + (h.pri === '高' ? 'uk-badge-destructive' : 'uk-badge-secondary'); p.textContent = h.pri;
    const s = document.createElement('span'); s.className = 'truncate'; s.textContent = h.title;
    a.append(t, p, s);
    a.onclick = (ev) => { ev.preventDefault(); $('fTitle').value = h.title; $('fBody').value = h.body; };
    li.appendChild(a); ul.appendChild(li);
  }
}
async function submit() {
  const title = $('fTitle').value.trim(), body = $('fBody').value.trim(), pri = $('fPri').value;
  if (title === '' || client.busy) return;
  const msg = '【表单提交】\n标题:' + title + '\n优先级:' + pri + (body ? '\n详情:' + body : '') + '\n请按你的职责处理这条提交,给出处理过程与明确结论。';
  result.textContent = ''; result.classList.remove('text-muted-foreground'); tools.innerHTML = '';
  setBusy(true);
  const hist = loadHist(); hist.unshift({ at: new Date().toLocaleTimeString('zh-CN', { hour12: false }), title, body, pri });
  localStorage.setItem(HKEY, JSON.stringify(hist.slice(0, 50))); renderHist();
  try { await client.ask(msg); setBusy(false); ledger.refresh(); }
  catch (_) { /* onError 已出声 */ }
}
$('submitBtn').onclick = submit;
AssemblerSDK.bindEnter($('fTitle'), submit);
renderHist();
</script>
</body>
</html>
