<!doctype html>
<!-- data-desk — 记录台(Franken UI):一句话记一笔、一键查询汇总,json 表格自动渲染。 -->
<html lang="zh" class="uk-theme-zinc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · 记录台</title>
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="_vendor/core.min.css">
<link rel="stylesheet" href="_vendor/utilities.min.css">
<script src="_vendor/core.iife.js" defer></script>
<script src="_vendor/assembler-sdk.js"></script>
<style>
  .dot{width:9px;height:9px;border-radius:9999px;background:hsl(var(--muted-foreground));flex:none}
  .dot.busy{background:hsl(var(--primary));animation:pulse 1.1s infinite}
  .dot.ok{background:#10a37f}
  @keyframes pulse{50%{opacity:.3}}
  .prewrap{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
<header class="sticky top-0 z-10 flex items-center gap-3 border-b border-border bg-card px-6 py-3">
  <div class="dot" id="dot"></div>
  <div>
    <div class="font-semibold">{{title}} · 记录台</div>
    <div class="text-xs text-muted-foreground">preset {{presetId}} · 记录/查询直达 agent</div>
  </div>
</header>
<div class="max-w-3xl mx-auto px-5 py-6 flex flex-col gap-5">
  <div class="uk-card">
    <div class="uk-card-header"><h2 class="uk-card-title text-sm">记一笔</h2></div>
    <div class="uk-card-body flex gap-2">
      <input id="addBox" class="uk-input flex-1" placeholder="用一句话描述这条记录,例如:午饭 32 元…(Enter 提交)">
      <button class="uk-btn uk-btn-primary" id="addBtn">记录</button>
    </div>
  </div>
  <div class="uk-card">
    <div class="uk-card-header"><h2 class="uk-card-title text-sm">查询</h2></div>
    <div class="uk-card-body flex flex-col gap-3">
      <div class="flex gap-2">
        <input id="qBox" class="uk-input flex-1" placeholder="想查什么?例如:本月支出汇总…(Enter 查询)">
        <button class="uk-btn uk-btn-default" id="qBtn">查询</button>
      </div>
      <div class="flex flex-wrap gap-2">
        <button class="uk-btn uk-btn-default uk-btn-sm" data-q="请汇总当前全部记录,给出总数与关键统计。">全部汇总</button>
        <button class="uk-btn uk-btn-default uk-btn-sm" data-q="请列出最近 10 条记录。">最近 10 条</button>
        <button class="uk-btn uk-btn-default uk-btn-sm" data-q="请按类别/类型分组统计当前记录。">分组统计</button>
      </div>
    </div>
  </div>
  <!-- 直连台账(双面化①):零件服务脸在场时才显示——查/表渲染绕开模型,毫秒级。
       记一笔仍走 agent(自然语言解析是薄判断,归模型);这就是"按判断密度分流"。 -->
  <div class="uk-card" id="liveCard" style="display:none">
    <div class="uk-card-header flex items-center justify-between">
      <h2 class="uk-card-title text-sm">实时台账 <span class="text-xs text-muted-foreground">(直连,不经模型)</span></h2>
      <div class="flex items-center gap-2">
        <select id="liveTable" class="uk-select uk-btn-sm" style="width:auto"></select>
        <button class="uk-btn uk-btn-default uk-btn-sm" id="liveRefresh">刷新</button>
      </div>
    </div>
    <div class="uk-card-body">
      <div class="overflow-x-auto" id="liveHost"><div class="text-muted-foreground text-sm">加载中…</div></div>
    </div>
  </div>
  <div class="uk-card">
    <div class="uk-card-header"><h2 class="uk-card-title text-sm">结果</h2></div>
    <div class="uk-card-body">
      <div class="uk-alert uk-alert-destructive mb-3" id="err" style="display:none"></div>
      <div class="prewrap text-muted-foreground" id="out">记录或查询后,agent 的回复在这里实时出现;回复里带表格数据时会自动渲染成表。</div>
      <div class="overflow-x-auto" id="tableHost"></div>
      <div class="flex flex-wrap gap-1 mt-3" id="tools"></div>
    </div>
  </div>
</div>
<script>
const CFG = { presetId: '{{presetId}}', workdir: '{{workdir}}' };
const HINT = '\n(如结果含结构化数据,请在回复末尾附一个 ```json 围栏,形如 {"table":{"columns":[...],"rows":[[...]]}}。)';
const $ = (id) => document.getElementById(id);
const out = $('out'), dot = $('dot'), tools = $('tools'), tableHost = $('tableHost');

function setBusy(b) { dot.className = 'dot ' + (b ? 'busy' : 'ok'); $('addBtn').disabled = b; $('qBtn').disabled = b; }
function showErr(m) { const e = $('err'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 8000); }

const client = AssemblerSDK.createClient({
  presetId: CFG.presetId, workdir: CFG.workdir,
  onDelta: (buf) => { out.classList.remove('text-muted-foreground'); out.textContent = buf.replace(/```json[\s\S]*?```/g, '').trim() || '(整理数据中…)'; },
  onToolCall: (name) => { const c = document.createElement('span'); c.className = 'uk-badge uk-badge-secondary'; c.textContent = '🔧 ' + name; tools.appendChild(c); },
  onError: (m) => { setBusy(false); showErr(m); },
});
const ledger = AssemblerSDK.mountLiveLedger({ presetId: CFG.presetId, cardEl: $('liveCard'), tableSel: $('liveTable'), hostEl: $('liveHost'), refreshBtn: $('liveRefresh') });

function renderTable(fence) {
  tableHost.innerHTML = '';
  if (!fence.ok) return; // 查询类回复不强制围栏:无围栏 = 纯文字答案,不算错
  const data = fence.data;
  let cols = null, rows = null;
  if (data && data.table && Array.isArray(data.table.columns)) { cols = data.table.columns; rows = data.table.rows || []; }
  else if (Array.isArray(data) && data.length > 0 && typeof data[0] === 'object') { cols = Object.keys(data[0]); rows = data.map((r) => cols.map((c) => r[c])); }
  if (!cols) return;
  const t = document.createElement('table'); t.className = 'uk-table uk-table-divider uk-table-hover mt-3';
  t.innerHTML = '<thead><tr></tr></thead><tbody></tbody>';
  const hr = t.querySelector('thead tr');
  for (const c of cols) { const th = document.createElement('th'); th.textContent = String(c); hr.appendChild(th); }
  const tb = t.querySelector('tbody');
  for (const r of rows.slice(0, 100)) {
    const tr = document.createElement('tr');
    for (const v of r) { const td = document.createElement('td'); td.textContent = v == null ? '' : String(v); tr.appendChild(td); }
    tb.appendChild(tr);
  }
  tableHost.appendChild(t);
}

async function ask(text) {
  if (client.busy) return;
  out.textContent = ''; tools.innerHTML = ''; setBusy(true);
  try {
    const r = await client.ask(text);
    setBusy(false);
    renderTable(r.fence);
    ledger.refresh();
  } catch (_) { /* onError 已出声 */ }
}

$('addBtn').onclick = () => { const v = $('addBox').value.trim(); if (v) { ask('请记录:' + v); $('addBox').value = ''; } };
AssemblerSDK.bindEnter($('addBox'), () => $('addBtn').click());
$('qBtn').onclick = () => { const v = $('qBox').value.trim(); if (v) ask(v + HINT); };
AssemblerSDK.bindEnter($('qBox'), () => $('qBtn').click());
document.querySelectorAll('[data-q]').forEach((c) => { c.onclick = () => ask(c.dataset.q + HINT); });
window.addEventListener('load', () => setTimeout(() => ask('请汇总当前全部记录,给出总数与关键统计。' + HINT), 300));
</script>
</body>
</html>
