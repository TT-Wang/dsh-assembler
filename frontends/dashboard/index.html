<!doctype html>
<!-- dashboard — 仪表盘(Franken UI):一键让 agent 汇总概览,渲染指标卡与明细表。
     页面自带 json 契约,不依赖 persona。 -->
<html lang="zh" class="uk-theme-zinc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · 仪表盘</title>
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="_vendor/core.min.css">
<link rel="stylesheet" href="_vendor/utilities.min.css">
<script src="_vendor/core.iife.js" defer></script>
<script src="_vendor/assembler-sdk.js"></script>
<style>
  .dot{width:9px;height:9px;border-radius:9999px;background:hsl(var(--muted-foreground));flex:none}
  .dot.busy{background:hsl(var(--primary));animation:pulse 1.1s infinite}
  .dot.ok{background:#10a37f}
  @keyframes pulse{50%{opacity:.3}}
  .prewrap{white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
<header class="sticky top-0 z-10 flex items-center gap-3 border-b border-border bg-card px-6 py-3">
  <div class="dot" id="dot"></div>
  <div>
    <div class="font-semibold">{{title}} · 仪表盘</div>
    <div class="text-xs text-muted-foreground">preset {{presetId}} · agent 实时汇总</div>
  </div>
  <div class="flex-1"></div>
  <button class="uk-btn uk-btn-primary" id="refreshBtn">刷新概览</button>
</header>
<div class="max-w-5xl mx-auto px-5 py-6 flex flex-col gap-5">
  <div class="uk-alert uk-alert-destructive" id="err" style="display:none"></div>
  <div class="grid gap-4 grid-cols-2 md:grid-cols-4" id="cards">
    <div class="col-span-2 md:col-span-4 text-center text-muted-foreground py-14">点右上「刷新概览」,agent 会实时汇总数据并填充指标卡。</div>
  </div>
  <div class="uk-card">
    <div class="uk-card-header"><h2 class="uk-card-title text-sm">明细</h2></div>
    <div class="uk-card-body">
      <div class="overflow-x-auto" id="tableHost"><div class="text-center text-muted-foreground py-8">暂无明细。</div></div>
      <div class="flex flex-wrap gap-1 mt-3" id="tools"></div>
      <div class="max-w-5xl mx-auto px-5 pb-5">  <div class="uk-card" id="liveCard" style="display:none">
    <div class="uk-card-header flex items-center justify-between">
      <h2 class="uk-card-title text-sm">实时台账 <span class="text-xs text-muted-foreground">(直连,不经模型)</span></h2>
      <span class="flex items-center gap-2"><select id="liveTable" class="uk-select uk-btn-sm" style="width:auto"></select><button class="uk-btn uk-btn-default uk-btn-sm" id="liveRefresh">刷新</button></span>
    </div>
    <div class="uk-card-body"><div class="overflow-x-auto" id="liveHost"></div></div>
  </div>
</div>
<details class="mt-3"><summary class="text-xs text-muted-foreground cursor-pointer">agent 原文</summary>
        <div class="prewrap text-sm text-muted-foreground mt-2" id="raw"></div></details>
    </div>
  </div>
</div>
<script>
const CFG = { presetId: '{{presetId}}', workdir: '{{workdir}}' };
const $ = (id) => document.getElementById(id);
const dot = $('dot'), cards = $('cards'), tableHost = $('tableHost'), raw = $('raw'), tools = $('tools');
const CONTRACT = '请汇总当前数据,给出概览。回复末尾必须附一个 ```json 围栏,形如:\n' +
  '```json\n{"cards":[{"label":"指标名","value":"数值","hint":"补充说明"}],"table":{"columns":["列1","列2"],"rows":[["a","b"]]}}\n```\n' +
  'cards 是 3-6 个最重要的指标;没有数据就如实给零值卡,不要编造。';

function setBusy(b) { dot.className = 'dot ' + (b ? 'busy' : 'ok'); $('refreshBtn').disabled = b; }
function showErr(m) { const e = $('err'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 8000); }

const client = AssemblerSDK.createClient({
  presetId: CFG.presetId, workdir: CFG.workdir,
  onToolCall: (name) => { const c = document.createElement('span'); c.className = 'uk-badge uk-badge-secondary'; c.textContent = '🔧 ' + name; tools.appendChild(c); },
  onError: (m) => { setBusy(false); showErr(m); },
});
const ledger = AssemblerSDK.mountLiveLedger({ presetId: CFG.presetId, cardEl: $('liveCard'), tableSel: $('liveTable'), hostEl: $('liveHost'), refreshBtn: $('liveRefresh') });

function render(data) {
  if (Array.isArray(data.cards) && data.cards.length > 0) {
    cards.innerHTML = '';
    for (const c of data.cards.slice(0, 8)) {
      const d = document.createElement('div'); d.className = 'uk-card uk-card-body';
      const l = document.createElement('div'); l.className = 'text-xs text-muted-foreground'; l.textContent = String(c.label ?? '');
      const v = document.createElement('div'); v.className = 'text-2xl font-bold mt-1'; v.textContent = String(c.value ?? '—');
      const h = document.createElement('div'); h.className = 'text-xs text-muted-foreground mt-1'; h.textContent = String(c.hint ?? '');
      d.append(l, v, h); cards.appendChild(d);
    }
  }
  const t = data.table;
  if (t && Array.isArray(t.columns)) {
    tableHost.innerHTML = '';
    const el = document.createElement('table'); el.className = 'uk-table uk-table-divider uk-table-hover';
    el.innerHTML = '<thead><tr></tr></thead><tbody></tbody>';
    const hr = el.querySelector('thead tr');
    for (const c of t.columns) { const th = document.createElement('th'); th.textContent = String(c); hr.appendChild(th); }
    const tb = el.querySelector('tbody');
    for (const r of (t.rows || []).slice(0, 200)) {
      const tr = document.createElement('tr');
      for (const v of r) { const td = document.createElement('td'); td.textContent = v == null ? '' : String(v); tr.appendChild(td); }
      tb.appendChild(tr);
    }
    tableHost.appendChild(el);
  }
}

$('refreshBtn').onclick = async () => {
  if (client.busy) return;
  tools.innerHTML = ''; setBusy(true);
  try {
    const r = await client.ask(CONTRACT);
    setBusy(false);
    raw.textContent = r.reply;
    if (!r.fence.ok) { showErr('概览未更新:' + r.fence.reason); return; }
    render(r.fence.data);
    ledger.refresh();
  } catch (_) { /* onError 已出声 */ }
};
window.addEventListener('load', () => setTimeout(() => $('refreshBtn').click(), 300));
</script>
</body>
</html>
