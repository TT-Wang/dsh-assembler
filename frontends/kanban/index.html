<!doctype html>
<!-- kanban — 任务看板(Franken UI):三列看板 + 拖拽移动 + 快速添加,数据由 agent 供给
     (页面自带 json 契约,不依赖 persona)。 -->
<html lang="zh" class="uk-theme-zinc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · 看板</title>
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="_vendor/core.min.css">
<link rel="stylesheet" href="_vendor/utilities.min.css">
<script src="_vendor/core.iife.js" defer></script>
<script src="_vendor/assembler-sdk.js"></script>
<style>
  .dot{width:9px;height:9px;border-radius:9999px;background:hsl(var(--muted-foreground));flex:none}
  .dot.busy{background:hsl(var(--primary));animation:pulse 1.1s infinite}
  .dot.ok{background:#10a37f}
  @keyframes pulse{50%{opacity:.3}}
  .prewrap{white-space:pre-wrap;word-break:break-word}
  .kcard{cursor:grab} .kcard:active{cursor:grabbing}
  .col-drop{outline:2px solid hsl(var(--primary));outline-offset:2px}
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
<header class="sticky top-0 z-10 flex items-center gap-3 border-b border-border bg-card px-6 py-3">
  <div class="dot" id="dot"></div>
  <div>
    <div class="font-semibold">{{title}} · 看板</div>
    <div class="text-xs text-muted-foreground">preset {{presetId}} · 拖拽卡片即移动任务</div>
  </div>
  <div class="flex-1"></div>
  <button class="uk-btn uk-btn-primary" id="refreshBtn">刷新看板</button>
</header>
<div class="max-w-5xl mx-auto px-5 pt-5">
  <div class="uk-alert uk-alert-destructive mb-3" id="err" style="display:none"></div>
  <div class="flex gap-2">
    <input id="addBox" class="uk-input flex-1" placeholder="添加任务:一句话描述,例如:整理季度报告初稿…(Enter 添加)">
    <button class="uk-btn uk-btn-primary" id="addBtn">添加</button>
  </div>
</div>
<div class="max-w-5xl mx-auto px-5 py-5 grid gap-4 md:grid-cols-3 items-start" id="board"></div>
<div class="max-w-5xl mx-auto px-5 pb-3 flex flex-wrap gap-1" id="tools"></div>
<div class="max-w-5xl mx-auto px-5 pb-5" >
  <div class="uk-card" id="liveCard" style="display:none">
    <div class="uk-card-header flex items-center justify-between">
      <h2 class="uk-card-title text-sm">实时台账 <span class="text-xs text-muted-foreground">(直连,不经模型)</span></h2>
      <span class="flex items-center gap-2"><select id="liveTable" class="uk-select uk-btn-sm" style="width:auto"></select><button class="uk-btn uk-btn-default uk-btn-sm" id="liveRefresh">刷新</button></span>
    </div>
    <div class="uk-card-body"><div class="overflow-x-auto" id="liveHost"></div></div>
  </div>
</div>
<details class="max-w-5xl mx-auto px-5 pb-8"><summary class="text-xs text-muted-foreground cursor-pointer">agent 原文</summary>
  <div class="prewrap text-sm text-muted-foreground mt-2" id="raw"></div></details>
<script>
const CFG = { presetId: '{{presetId}}', workdir: '{{workdir}}' };
const COLS = ['待办', '进行中', '已完成'];
const $ = (id) => document.getElementById(id);
const board = $('board'), dot = $('dot'), tools = $('tools'), raw = $('raw');
const CONTRACT = '回复末尾必须附一个 ```json 围栏,给出当前完整看板,形如:\n' +
  '```json\n{"columns":[{"title":"待办","cards":[{"title":"任务标题","desc":"补充说明"}]},{"title":"进行中","cards":[]},{"title":"已完成","cards":[]}]}\n```\n' +
  '列固定为 待办/进行中/已完成 三列;没有任务就给空数组,不要编造。';

function setBusy(b) { dot.className = 'dot ' + (b ? 'busy' : 'ok'); $('refreshBtn').disabled = b; $('addBtn').disabled = b; }
function showErr(m) { const e = $('err'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 8000); }

const client = AssemblerSDK.createClient({
  presetId: CFG.presetId, workdir: CFG.workdir,
  onToolCall: (name) => { const c = document.createElement('span'); c.className = 'uk-badge uk-badge-secondary'; c.textContent = '🔧 ' + name; tools.appendChild(c); },
  onError: (m) => { setBusy(false); showErr(m); },
});
const ledger = AssemblerSDK.mountLiveLedger({ presetId: CFG.presetId, cardEl: $('liveCard'), tableSel: $('liveTable'), hostEl: $('liveHost'), refreshBtn: $('liveRefresh') });

async function ask(text) {
  if (client.busy) return;
  tools.innerHTML = ''; setBusy(true);
  try {
    const out = await client.ask(text);
    setBusy(false);
    raw.textContent = out.reply;
    // 失败出声(病史:围栏解析失败静默 return,用户拖了卡界面装死)
    if (!out.fence.ok) { showErr('看板未更新:' + out.fence.reason); return; }
    render(out.fence.data);
    ledger.refresh();
  } catch (_) { /* onError 已出声 */ }
}

function render(data) {
  if (!Array.isArray(data.columns)) { showErr('看板未更新:围栏里没有 columns 数组'); return; }
  board.innerHTML = '';
  for (const colName of COLS) {
    const src = data.columns.find((c) => c && c.title === colName) || { cards: [] };
    const cardsArr = Array.isArray(src.cards) ? src.cards : [];
    const col = document.createElement('div'); col.className = 'uk-card';
    const head = document.createElement('div'); head.className = 'uk-card-header flex items-center justify-between';
    const ttl = document.createElement('h2'); ttl.className = 'uk-card-title text-sm'; ttl.textContent = colName;
    const n = document.createElement('span'); n.className = 'uk-badge uk-badge-secondary'; n.textContent = cardsArr.length;
    head.append(ttl, n);
    const bodyEl = document.createElement('div'); bodyEl.className = 'uk-card-body pt-0 flex flex-col gap-2 min-h-24';
    col.append(head, bodyEl);
    if (cardsArr.length === 0) { const em = document.createElement('div'); em.className = 'text-center text-sm text-muted-foreground py-6'; em.textContent = '空'; bodyEl.appendChild(em); }
    for (const c of cardsArr.slice(0, 50)) {
      const el = document.createElement('div');
      el.className = 'kcard rounded-lg border border-border bg-muted p-3 text-sm'; el.draggable = true;
      const t = document.createElement('div'); t.className = 'font-medium'; t.textContent = String(c.title ?? '');
      el.appendChild(t);
      if (c.desc) { const d = document.createElement('div'); d.className = 'text-xs text-muted-foreground mt-1'; d.textContent = String(c.desc); el.appendChild(d); }
      el.addEventListener('dragstart', (ev) => { ev.dataTransfer.setData('text/plain', JSON.stringify({ title: c.title, from: colName })); });
      bodyEl.appendChild(el);
    }
    col.addEventListener('dragover', (ev) => { ev.preventDefault(); col.classList.add('col-drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('col-drop'));
    col.addEventListener('drop', (ev) => {
      ev.preventDefault(); col.classList.remove('col-drop');
      let payload; try { payload = JSON.parse(ev.dataTransfer.getData('text/plain')); } catch { showErr('拖拽数据无法解析,请重试'); return; }
      if (payload.from === colName) return;
      ask('把任务「' + payload.title + '」的状态改为「' + colName + '」。' + CONTRACT);
    });
    board.appendChild(col);
  }
}

$('refreshBtn').onclick = () => ask('请给出当前看板。' + CONTRACT);
$('addBtn').onclick = () => { const v = $('addBox').value.trim(); if (v) { ask('新增任务:' + v + '(放入「待办」列)。' + CONTRACT); $('addBox').value = ''; } };
AssemblerSDK.bindEnter($('addBox'), () => $('addBtn').click());
window.addEventListener('load', () => setTimeout(() => ask('请给出当前看板。' + CONTRACT), 300));
</script>
</body>
</html>
