<!doctype html>
<!-- file-desk — 文件台(Franken UI):工作区文件清单由 agent 供给,选中即可让
     agent 读/总结/整理;快速存一条笔记为文件。页面自带 json 契约。 -->
<html lang="zh" class="uk-theme-zinc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · 文件台</title>
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="_vendor/core.min.css">
<link rel="stylesheet" href="_vendor/utilities.min.css">
<script src="_vendor/core.iife.js" defer></script>
<script src="_vendor/assembler-sdk.js"></script>
<style>
  .dot{width:9px;height:9px;border-radius:9999px;background:hsl(var(--muted-foreground));flex:none}
  .dot.busy{background:hsl(var(--primary));animation:pulse 1.1s infinite}
  .dot.ok{background:#10a37f}
  @keyframes pulse{50%{opacity:.3}}
  .prewrap{white-space:pre-wrap;word-break:break-word}
  tr.sel td{background:hsl(var(--muted))}
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
<header class="sticky top-0 z-10 flex items-center gap-3 border-b border-border bg-card px-6 py-3">
  <div class="dot" id="dot"></div>
  <div>
    <div class="font-semibold">{{title}} · 文件台</div>
    <div class="text-xs text-muted-foreground">preset {{presetId}} · 工作区文件直达 agent</div>
  </div>
  <div class="flex-1"></div>
  <button class="uk-btn uk-btn-primary" id="refreshBtn">刷新清单</button>
</header>
<div class="max-w-5xl mx-auto px-5 py-6 grid gap-5 md:grid-cols-[1fr_380px]">
  <div class="flex flex-col gap-5">
    <div class="uk-alert uk-alert-destructive" id="err" style="display:none"></div>
    <div class="uk-card">
      <div class="uk-card-header flex items-center justify-between">
        <h2 class="uk-card-title text-sm">工作区文件</h2>
        <div class="flex gap-2">
          <button class="uk-btn uk-btn-default uk-btn-sm" id="sumBtn" disabled>总结选中</button>
          <button class="uk-btn uk-btn-default uk-btn-sm" id="readBtn" disabled>读出内容</button>
        </div>
      </div>
      <div class="uk-card-body pt-0 overflow-x-auto">
        <table class="uk-table uk-table-divider uk-table-hover" id="ftab">
          <thead><tr><th>文件</th><th>大小</th><th>修改时间</th></tr></thead>
          <tbody id="fbody"><tr><td colspan="3" class="text-center text-muted-foreground py-8">点右上「刷新清单」,agent 会列出工作区文件。</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="uk-card">
      <div class="uk-card-header"><h2 class="uk-card-title text-sm">agent 答复</h2></div>
      <div class="uk-card-body">
        <div class="prewrap text-muted-foreground" id="out">操作后,agent 的答复在这里实时出现。</div>
        <div class="flex flex-wrap gap-1 mt-3" id="tools"></div>
      </div>
    </div>
  </div>
  <div class="uk-card h-fit">
    <div class="uk-card-header"><h2 class="uk-card-title text-sm">快速存笔记</h2></div>
    <div class="uk-card-body flex flex-col gap-3">
      <input id="noteName" class="uk-input" placeholder="文件名,例如 会议纪要.md">
      <textarea id="noteBody" class="uk-input min-h-32" placeholder="内容…"></textarea>
      <button class="uk-btn uk-btn-primary" id="saveBtn">让 agent 存为文件</button>
    </div>
  </div>
</div>
<script>
const CFG = { presetId: '{{presetId}}', workdir: '{{workdir}}' };
const $ = (id) => document.getElementById(id);
const fbody = $('fbody'), out = $('out'), dot = $('dot'), tools = $('tools');
let selected = null;
const CONTRACT = '回复末尾必须附一个 ```json 围栏,列出工作区(当前目录)全部文件,形如:\n' +
  '```json\n{"files":[{"name":"a.md","size":"1.2 KB","modified":"2026-08-21 10:00"}]}\n```\n' +
  '只列真实存在的文件;空目录给空数组,不要编造。';

function setBusy(b) { dot.className = 'dot ' + (b ? 'busy' : 'ok'); $('refreshBtn').disabled = b; }
function showErr(m) { const e = $('err'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 8000); }

const client = AssemblerSDK.createClient({
  presetId: CFG.presetId, workdir: CFG.workdir,
  onDelta: (buf) => { out.classList.remove('text-muted-foreground'); out.textContent = buf.replace(/```json[\s\S]*?```/g, '').trim() || '(处理中…)'; },
  onToolCall: (name) => { const c = document.createElement('span'); c.className = 'uk-badge uk-badge-secondary'; c.textContent = '🔧 ' + name; tools.appendChild(c); },
  onError: (m) => { setBusy(false); showErr(m); },
});

function renderFiles(files) {
  fbody.innerHTML = '';
  if (!files.length) { fbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted-foreground py-8">工作区为空。</td></tr>'; return; }
  for (const f of files.slice(0, 200)) {
    const tr = document.createElement('tr'); tr.style.cursor = 'pointer';
    for (const v of [f.name, f.size ?? '', f.modified ?? '']) { const td = document.createElement('td'); td.textContent = String(v ?? ''); tr.appendChild(td); }
    tr.onclick = () => {
      selected = f.name;
      [...fbody.children].forEach((r) => r.classList.remove('bg-muted'));
      tr.classList.add('bg-muted');
      $('sumBtn').disabled = false; $('readBtn').disabled = false;
    };
    fbody.appendChild(tr);
  }
}

async function ask(text) {
  if (client.busy) return;
  out.textContent = ''; tools.innerHTML = ''; setBusy(true);
  try {
    const r = await client.ask(text);
    setBusy(false);
    if (r.fence.ok && Array.isArray(r.fence.data.files)) renderFiles(r.fence.data.files);
    else if (!r.fence.ok && text.includes('清单')) showErr('清单未更新:' + r.fence.reason);
  } catch (_) { /* onError 已出声 */ }
}

$('refreshBtn').onclick = () => ask('请列出工作区文件清单。' + CONTRACT);
$('sumBtn').onclick = () => { if (selected) ask('请阅读文件「' + selected + '」并给出要点总结。'); };
$('readBtn').onclick = () => { if (selected) ask('请读出文件「' + selected + '」的完整内容。'); };
$('saveBtn').onclick = () => {
  const name = $('noteName').value.trim(), body = $('noteBody').value.trim();
  if (!name || !body) return;
  ask('请把以下内容保存为工作区文件「' + name + '」,保存后确认字节数:\n' + body + '\n保存完成后:' + CONTRACT);
  $('noteName').value = ''; $('noteBody').value = '';
};
window.addEventListener('load', () => setTimeout(() => $('refreshBtn').click(), 300));

// 直传通道(file-channel 服务脸在场才启用):大字节直进工作区,不过模型
AssemblerSDK.discoverServices(CFG.presetId).then((svc) => {
  const files = AssemblerSDK.filesFace(svc);
  if (!files) return;
  $('upCard').style.display = '';
  $('upBtn').onclick = async () => {
    const f = $('upInput').files[0];
    if (!f) return;
    $('upBtn').disabled = true;
    try {
      const r = await files.upload(f.name, f);
      out.textContent = '已直传:' + r.name + '(' + r.bytes + ' 字节)→ ' + r.path + '\n(字节没有经过模型)';
      $('refreshBtn').click();
    } catch (e) { showErr('直传失败:' + String(e && e.message || e)); }
    finally { $('upBtn').disabled = false; }
  };
}).catch(() => {});
</script>
</body>
</html>
