<!doctype html>
<!-- file-desk — 文件台(Franken UI):工作区文件清单由 agent 供给,选中即可让
     agent 读/总结/整理;快速存一条笔记为文件。页面自带 json 契约。 -->
<html lang="zh" class="uk-theme-zinc">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · 文件台</title>
<script>if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark')</script>
<link rel="stylesheet" href="_vendor/core.min.css">
<link rel="stylesheet" href="_vendor/utilities.min.css">
<script src="_vendor/core.iife.js" defer></script>
<style>
  .dot{width:9px;height:9px;border-radius:9999px;background:hsl(var(--muted-foreground));flex:none}
  .dot.busy{background:hsl(var(--primary));animation:pulse 1.1s infinite}
  .dot.ok{background:#10a37f}
  @keyframes pulse{50%{opacity:.3}}
  .prewrap{white-space:pre-wrap;word-break:break-word}
  tr.sel td{background:hsl(var(--muted))}
</style>
</head>
<body class="bg-background text-foreground min-h-screen">
<header class="sticky top-0 z-10 flex items-center gap-3 border-b border-border bg-card px-6 py-3">
  <div class="dot" id="dot"></div>
  <div>
    <div class="font-semibold">{{title}} · 文件台</div>
    <div class="text-xs text-muted-foreground">preset {{presetId}} · 工作区文件直达 agent</div>
  </div>
  <div class="flex-1"></div>
  <button class="uk-btn uk-btn-primary" id="refreshBtn">刷新清单</button>
</header>
<div class="max-w-5xl mx-auto px-5 py-6 grid gap-5 md:grid-cols-[1fr_380px]">
  <div class="flex flex-col gap-5">
    <div class="uk-alert uk-alert-destructive" id="err" style="display:none"></div>
    <div class="uk-card">
      <div class="uk-card-header flex items-center justify-between">
        <h2 class="uk-card-title text-sm">工作区文件</h2>
        <div class="flex gap-2">
          <button class="uk-btn uk-btn-default uk-btn-sm" id="sumBtn" disabled>总结选中</button>
          <button class="uk-btn uk-btn-default uk-btn-sm" id="readBtn" disabled>读出内容</button>
        </div>
      </div>
      <div class="uk-card-body pt-0 overflow-x-auto">
        <table class="uk-table uk-table-divider uk-table-hover" id="ftab">
          <thead><tr><th>文件</th><th>大小</th><th>修改时间</th></tr></thead>
          <tbody id="fbody"><tr><td colspan="3" class="text-center text-muted-foreground py-8">点右上「刷新清单」,agent 会列出工作区文件。</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="uk-card">
      <div class="uk-card-header"><h2 class="uk-card-title text-sm">agent 答复</h2></div>
      <div class="uk-card-body">
        <div class="prewrap text-muted-foreground" id="out">操作后,agent 的答复在这里实时出现。</div>
        <div class="flex flex-wrap gap-1 mt-3" id="tools"></div>
      </div>
    </div>
  </div>
  <div class="uk-card h-fit">
    <div class="uk-card-header"><h2 class="uk-card-title text-sm">快速存笔记</h2></div>
    <div class="uk-card-body flex flex-col gap-3">
      <input id="noteName" class="uk-input" placeholder="文件名,例如 会议纪要.md">
      <textarea id="noteBody" class="uk-input min-h-32" placeholder="内容…"></textarea>
      <button class="uk-btn uk-btn-primary" id="saveBtn">让 agent 存为文件</button>
    </div>
  </div>
</div>
<script>
const CFG = { presetId: '{{presetId}}', workdir: '{{workdir}}' };
let sessionId = null, ws = null, busy = false, replyBuf = '', selected = null;
const $ = (id) => document.getElementById(id);
const fbody = $('fbody'), out = $('out'), dot = $('dot'), tools = $('tools');
const CONTRACT = '回复末尾必须附一个 ```json 围栏,列出工作区(当前目录)全部文件,形如:\n' +
  '```json\n{"files":[{"name":"a.md","size":"1.2 KB","modified":"2026-08-21 10:00"}]}\n```\n' +
  '只列真实存在的文件;空目录给空数组,不要编造。';

function setBusy(b) { busy = b; dot.className = 'dot ' + (b ? 'busy' : 'ok');
  ['refreshBtn','saveBtn'].forEach((i) => $(i).disabled = b);
  $('sumBtn').disabled = b || !selected; $('readBtn').disabled = b || !selected; }
function showErr(m) { const e = $('err'); e.textContent = m; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 8000); }
async function rpc(method, payload) {
  const res = await fetch('/api/' + method, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'client-request', rpcId: 'fe-' + Date.now() + '-' + Math.random().toString(36).slice(2), method, payload }) });
  const j = await res.json();
  if (!j.result || !j.result.ok) throw new Error(method + ' 失败: ' + JSON.stringify(j.result && j.result.error || j).slice(0, 200));
  return j.result.value;
}
function openWs() {
  ws = new WebSocket(location.origin.replace(/^http/, 'ws') + '/api/events.mux');
  ws.onmessage = (m) => { let f; try { f = JSON.parse(String(m.data)); } catch { return; }
    const p = f.payload; if (!p || p.type !== 'session/event' || p.sessionId !== sessionId) return; handle(p.event); };
  ws.onclose = () => { if (sessionId) setTimeout(openWs, 1500); };
}
function textOf(e) { const c = e.data && e.data.message && e.data.message.content;
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.map((b) => b && b.type === 'text' ? b.text : '').join(''); return ''; }
function handle(e) {
  if (e.type === 'assistant/message') { const t = textOf(e); if (!t) return;
    out.classList.remove('text-muted-foreground');
    replyBuf += (replyBuf === '' ? '' : '\n') + t;
    out.textContent = replyBuf.replace(/```json[\s\S]*?```/g, '').trim() || '(整理中…)';
  } else if (e.type === 'tool/call') {
    const name = (e.data && e.data.name || '?').replace(/^mcp__/, '').replace(/__/, ' · ');
    const c = document.createElement('span'); c.className = 'uk-badge uk-badge-secondary'; c.textContent = '🔧 ' + name; tools.appendChild(c);
  } else if (e.type === 'turn/end') { setBusy(false); render(); }
}
function render() {
  const fences = [...replyBuf.matchAll(/```json\s*([\s\S]*?)```/g)];
  if (fences.length === 0) return;
  let data; try { data = JSON.parse(fences[fences.length - 1][1]); } catch { return; }
  if (!Array.isArray(data.files)) return;
  fbody.innerHTML = ''; selected = null; setBusy(false);
  if (data.files.length === 0) {
    fbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted-foreground py-8">工作区还是空的——右侧存一条笔记试试。</td></tr>'; return;
  }
  for (const f of data.files.slice(0, 200)) {
    const tr = document.createElement('tr');
    const n = document.createElement('td'); n.textContent = String(f.name ?? '');
    const s = document.createElement('td'); s.className = 'text-muted-foreground'; s.textContent = String(f.size ?? '');
    const m = document.createElement('td'); m.className = 'text-muted-foreground'; m.textContent = String(f.modified ?? '');
    tr.append(n, s, m);
    tr.onclick = () => {
      document.querySelectorAll('#fbody tr').forEach((x) => x.classList.remove('sel'));
      tr.classList.add('sel'); selected = String(f.name ?? '');
      $('sumBtn').disabled = busy; $('readBtn').disabled = busy;
    };
    fbody.appendChild(tr);
  }
}
async function ensureSession() {
  if (sessionId) return;
  const v = await rpc('session.create', { cwd: CFG.workdir, agentPreset: CFG.presetId });
  sessionId = v.sessionId; openWs();
  await new Promise((r) => { const t = setInterval(() => { if (ws && ws.readyState === 1) { clearInterval(t); r(); } }, 50); });
}
async function ask(text) {
  if (busy) return;
  replyBuf = ''; out.textContent = ''; tools.innerHTML = ''; setBusy(true);
  try { await ensureSession(); await rpc('session.prompt', { sessionId, mode: 'queue', content: [{ type: 'text', text }] }); }
  catch (err) { setBusy(false); showErr(String(err && err.message || err)); }
}
$('refreshBtn').onclick = () => ask('请列出工作区文件清单。' + CONTRACT);
window.addEventListener('load', () => setTimeout(() => $('refreshBtn').click(), 300));
$('sumBtn').onclick = () => { if (selected) ask('请阅读文件「' + selected + '」并给出要点总结。'); };
$('readBtn').onclick = () => { if (selected) ask('请读出文件「' + selected + '」的完整内容。'); };
$('saveBtn').onclick = () => {
  const name = $('noteName').value.trim(), body = $('noteBody').value.trim();
  if (!name || !body) return;
  ask('请把以下内容保存为工作区文件「' + name + '」,保存后确认字节数:\n' + body + '\n保存完成后:' + CONTRACT);
  $('noteName').value = ''; $('noteBody').value = '';
};
</script>
</body>
</html>
