      - { env: "S3_SECRET_KEY", purpose: "访问密钥" }


capabilities:
  # ── frontend templates(交互面零件:选形状,功能由其余零件供给)────────────
  # 装配时填参发射进 preset 的 frontend/,由 /assembler/ui/<preset> 同源伺服;
  # 页面直连 host wire(session.create/prompt + events.mux),即开即操作。
  # 没选任何前端零件时,chat-console 作为兜底自动随每个 preset 发射。
  - id: frontend-chat-console
