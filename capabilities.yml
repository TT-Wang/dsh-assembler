# dsh-cs-tools capability catalog — the vibe-assembly directory.
#
# One entry per reusable capability. The assembler reads this file, matches a
# natural-language requirement against `tags` / `description`, and emits an
# agent preset that mounts the selected rows.
#
# `via` — where the capability comes from:
#   package  → a tool in THIS package (dsh-cs-tools)
#   harness  → a built-in DeepSeek Harness tool, already available to any
#              preset that mounts the standard tool rows (see
#              presets/agent-template.yml)
#   mcp      → auto-generated at runtime from connected MCP servers
#              (federateMcpTools): every `mcp__*` tool in ctx.tools.visible
#              becomes an entry; the server's connection config must exist
#              under `mcp-servers` below (or be added to the preset by hand).
#
# `mcp-servers` — connection configs for MCP servers whose tools the
# assembler can select. When a selected capability references a server here,
# the emitted preset gains an mcp-client row for it.
#
# Entries are additive: adding a new capability is appending one entry —
# the assembler learns it automatically.

mcp-servers:
  filesystem:
    transport: stdio
    # 官方 filesystem MCP,以本 repo 依赖钉死绝对路径拉起。历史教训(2026-08-21
    # bilingual-reader 取证):此前声明 hostMounted + npx 全局挂载,npx 在 pnpm
    # 检出的 cwd 下解析 bin 失败(sh: mcp-server-filesystem: command not found),
    # 挂载天天死、目录却照旧售卖其工具 → agent 拿不到被承诺的文件工具,盲猜
    # 工具名后向用户求助,探针挂满 600s。现改为随 preset 发射(选中才挂,面窄),
    # @@WORKSPACE@@ 由发射端替换成该 preset 自己的 workspace/ 绝对路径——
    # 文件面 = agent 自己的工作区,一个 preset 一根,越界目录天然不存在。
    command: node
    args: ['/Users/tongtao/code/dsh-assembler/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js', '@@WORKSPACE@@']

  # ── 代码索引流水线产物（index/catalog.yml 一一对应）──────────────────────
  # 每个 server = generated/<id>/ 里的 MCP stdio 适配（我们生成的胶水，包装
  # 上游开源库）。hostMounted: false → 只有选中的 preset 才挂载（窄表面）。
  # 注意：mcp-client 的 serverName 在宿主进程内全局唯一，且 host 永不释放被
  # 取代 preset 代际占用的名字，所以 emitPreset 按 (preset id + 渲染全文) 哈希
  # 出 8 位后缀（如 http-request-59cbbdba）——文件字节决定名字：跨 preset、跨
  # 代际都不冲突。同一 preset 的并发会话共用同一 standing 挂载，天然无冲突
  # （已实证）。
  binary-write:
    transport: stdio
    command: node
    args: ['/Users/tongtao/code/dsh-assembler/generated/binary-write/index.js']

