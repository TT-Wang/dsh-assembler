capabilities:
  # ── customer-service domain tools (this package) ──────────────────────────
  - id: crm-query
    via: package
    tool: crm_query
    description: Look up a customer's orders and their status (order id, ETA, tracking).
    tags: [crm, order, orders, shipment, shipping, tracking, delivery, eta, refund, status, query]
    config: {}
  - id: ticket-create
    via: package
    tool: ticket_create
    description: Open a support ticket for an issue that needs a human (refund dispute, damaged item).
    tags: [ticket, ticket-create, escalation, complaint, refund-dispute, damaged, support]
    config: {}
  - id: human-handoff
    via: package
    tool: human_handoff
    description: Transfer the conversation to a human agent (user asked for human, or out of remit).
    tags: [human, handoff, human-agent, transfer, escalate, live-agent, representative]
    config: {}

  # ── harness-provided capabilities (reuse, not code) ───────────────────────
  - id: kb-search
    via: harness
    description: Search the knowledge base (FAQ/policy documents under kb/).
    tags: [knowledge, kb, faq, policy, docs, search, question, answer, refund-policy, shipping-policy]
    config:
      # Disabled for now: bare fs-search lets the model search the WHOLE host
      # (measured: 25+ glob/grep calls in the cs-03 damage scenario). A real
      # kb capability needs a scoped read tool rooted at kb/ — future work.
      enabled: false
  - id: web-lookup
    via: harness
    description: Search the web for current information (latest policy, news).
    tags: [web, search, internet, current, news, latest]
    config:
      presetRows:
        - id: tool-web
          name: '@deepseek-ai/dsh-tool-web'
          config:
            fetch: true
            searchTimeoutMs: 60000
  - id: content-search
    via: harness
    description: Search file contents by keyword and return the matching files with line numbers (grep-style content search).
    tags: [search, content, grep, keyword, text, find, files, 搜索, 内容, 关键字, 查找]
    config:
      presetRows:
        - id: tool-fs-search
          name: '@deepseek-ai/dsh-tool-fs-search'
          config:
            # Required since rc.x (no schema default); false = the harness
            # base bundle's own setting (packages/bundle/base/cordis.patch.yml).
            sampleOverCapGlobResults: false

  # ── persona / behavior (a capability in its own right) ────────────────────
  - id: file-manager-persona
    via: harness
    description: File-management assistant persona — lists directories, reads files, and searches file contents for the user.
    tags: [persona, tone, behavior, file, files, manager, directory, folder, list, read, search, 文件, 目录, 管理, 助手]
    config:
      persona: |
        You are a file-management assistant. Be concise and accurate. Answer in
        the user's language. Work ONLY with your filesystem tools — never
        invent file contents, and never use means outside your tool surface:
        - list directories: mcp__filesystem__list_directory (or
          mcp__filesystem__directory_tree for a recursive view) to show what a
          folder contains.
        - read files: mcp__filesystem__read_text_file to show a file's content.
        - search contents: grep to find files whose CONTENT matches a keyword —
          matches come back with file paths and line numbers. Use
          glob or mcp__filesystem__search_files to find files by NAME pattern.
        - when unsure where you may operate, check
          mcp__filesystem__list_allowed_directories first and stay inside the
          allowed roots.
        When a search matches many files, summarize the matches and read the
        most relevant file before answering in detail.

  - id: cs-persona
    via: harness
    description: Customer-service agent persona — polite, concise, resolves issues before escalating.
    tags: [persona, tone, behavior, customer-service, support-agent]
    config:
      # A domain persona declares its baseline tool surface: the assembler
      # force-includes these regardless of what the requirement happened to
      # mention, so a customer-service agent always gets the full toolkit.
      baselineTools: [crm_query, ticket_create, human_handoff]
      persona: |
        You are a customer-service agent for an online electronics store.
        Be polite and concise. Answer in the user's language.
        You have three tools. Use them, do not describe using them, and do
        not explore the host with other means:
        - crm_query: check order state before claiming anything about an order.
        - ticket_create: OPEN A TICKET directly when the user reports a
          damaged item, missing item, or refund dispute. Call the tool; never
          merely say a ticket is opened without calling it.
        - human_handoff: when the user asks for a human or the issue is out
          of remit.
        Damaged items: cite the short return policy, open the ticket, then
        tell the user a human will follow up. Do not stop to ask preference
        questions before the ticket exists.
