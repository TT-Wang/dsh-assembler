# PAGE-SPEC — 页面动作路由标注(写页之前先写这份;它同时是行为考的考卷种子)。
# 每个动作声明三件事:干什么、走哪条路由、怎么验效。
#   route: face    确定性流(SQL 直连服务脸)—— 必须给 sql;可给 effect(考官验效查询)
#   route: wire    判断流(真 agent 会话)   —— 必须给 probe(单轮考题)与 marks(验收标记)
#   route: ai-thin 薄判断(一次补全)        —— v1 经 wire 承载,标注留档
# 写手纪律:确定性动作(增删改查/汇总/渲染)一律 face;只有真需要判断的动作才 wire。
# dom 标注(可选,只许 face 动作):steps 只有 {fill,value}/{click} 两种;fill 必须把
# @@TOKEN@@ 织进输入、effect/expectText 至少一处含 @@TOKEN@@(区分口令,防行为考直打
# SQL 的行冒充页面点出来的行);selector 用你自己起的稳定 id(如 #draft/#addBtn)。
# 不标注也有保底:考官对每页做挂载死活考(#root 空白即 FAIL),未标注动作如实登记。
pages: []
